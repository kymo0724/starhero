<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>별빛 용사</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1630;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;background:radial-gradient(ellipse at 50% 20%,#4b3a8a 0%,#1b1630 70%);overflow:auto;z-index:20}
#menu h1{margin:0;font-size:40px;letter-spacing:2px;text-shadow:0 0 18px #ffd96b,0 3px 0 #6b4a12;color:#ffe9a3}
#menu .sub{margin:-6px 0 6px;color:#cfc6ff;font-size:15px}
#menu .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#menu label{font-size:14px;color:#cfc6ff}
#menu input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid #5d4fa3;background:#2a2250;color:#fff;outline:none;user-select:text;-webkit-user-select:text}
#menu input:focus{border-color:#ffd96b}
.cls{display:flex;gap:10px}
.cls button{flex:1;padding:12px 6px;border-radius:14px;border:2px solid #5d4fa3;background:#2a2250;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.cls button small{font-weight:400;font-size:12px;color:#bdb4ee}
.cls button.on{border-color:#ffd96b;background:#3d3175;box-shadow:0 0 12px #ffd96b66}
.big{padding:15px;border-radius:14px;border:0;background:linear-gradient(#ffd96b,#f0a93b);color:#3a2408;font-size:18px;font-weight:800;box-shadow:0 4px 0 #9a6214}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #9a6214}
.row{display:flex;gap:8px}
.row input{flex:1;text-align:center;letter-spacing:6px;font-size:20px}
.row button{padding:0 20px;border-radius:12px;border:0;background:#6fd28a;color:#0f3a1c;font-weight:800;font-size:17px}
.ghost{padding:11px;border-radius:12px;border:2px dashed #5d4fa3;background:none;color:#cfc6ff;font-size:15px}
#menuMsg{min-height:20px;margin:0;color:#ffb3b3;font-size:14px;text-align:center}
.tip{margin:0;font-size:13px;color:#a79fd6;line-height:1.5;text-align:center}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#stat{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:170px;background:#0009;border-radius:12px;padding:7px 9px}
#stat .nm{font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden}
#stat .nm b{color:#ffd96b}
.bar{position:relative;height:12px;border-radius:6px;background:#0008;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px}
.bar.hp i{background:linear-gradient(#ff7a7a,#d93b3b)}
.bar.xp{height:7px}.bar.xp i{background:linear-gradient(#8fe3ff,#3a9bdc)}
.bar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;text-shadow:0 1px 1px #000}
#quest{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));max-width:46vw;background:#0009;border-radius:12px;padding:7px 10px;font-size:13px;text-align:right}
#qT{font-weight:700;color:#ffe9a3}
#partner{font-size:12px;color:#cfe;margin-top:2px}
#code{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a2250ee;border:2px solid #ffd96b;border-radius:14px;padding:8px 14px;font-size:14px;text-align:center;display:none;white-space:nowrap}
#code b{font-size:24px;letter-spacing:4px;color:#ffd96b}
#bStory{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(70px + env(safe-area-inset-top));pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:#0009;font-size:20px}
#btns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:180px;height:150px}
#btns button{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid #fff8;font-weight:800;text-shadow:0 1px 2px #000;touch-action:none}
#bAtk{right:0;bottom:0;width:96px;height:96px;font-size:20px;background:radial-gradient(circle at 40% 35%,#ff8a6b,#c23a2a)}
#bSkill{left:6px;bottom:6px;width:70px;height:70px;font-size:14px;background:radial-gradient(circle at 40% 35%,#8fb8ff,#3a5bd0);overflow:hidden}
#bSkill .cd{position:absolute;inset:0;background:#1d2246;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:20px}
#btns button:active{filter:brightness(1.25)}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;white-space:nowrap}
#deadMsg{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;font-size:16px;display:none;background:#000b;padding:12px 18px;border-radius:14px;line-height:1.5}
#bossBar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(50vw,320px);display:none;text-align:center;font-size:13px;font-weight:700;color:#ffd0f0;text-shadow:0 1px 2px #000}
#bossBar .bar{height:10px;border:1px solid #fff5}
#bossBar .bar i{background:linear-gradient(#d96bff,#7a2bb8)}
#dlg{position:fixed;left:50%;top:calc(14% + env(safe-area-inset-top));transform:translateX(-50%);width:min(92vw,520px);background:#fffaf0;color:#2b2140;border:4px solid #6b4a12;border-radius:16px;padding:12px 16px 26px;display:none;z-index:15;box-shadow:0 8px 30px #0008;font-size:16px;line-height:1.55}
#dSp{font-weight:800;color:#8a3fc0;margin-bottom:3px;font-size:14px}
#dlg .nx{position:absolute;right:12px;bottom:5px;font-size:12px;color:#8a7a5a;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu">
  <h1>별빛 용사</h1>
  <p class="sub">둘이 함께 떠나는 몬스터 사냥 이야기 ✨</p>
  <div class="card">
    <label>내 이름<input id="inName" maxlength="8" placeholder="예: 영모"></label>
    <div class="cls">
      <button data-c="w">⚔️ 전사<small>튼튼해요 · 근접 공격</small></button>
      <button data-c="m">🔮 마법사<small>멀리서 마법 공격</small></button>
    </div>
    <button id="bHost" class="big">방 만들기</button>
    <div class="row"><input id="inCode" inputmode="numeric" maxlength="4" placeholder="코드 4자리"><button id="bJoin">참가</button></div>
    <button id="bSolo" class="ghost">혼자 연습하기</button>
    <p id="menuMsg"></p>
    <p class="tip">한 사람이 <b>방 만들기</b>를 누르면 4자리 코드가 나와요.<br>다른 사람이 그 코드를 넣고 <b>참가</b>하면 같이 플레이!<br>같은 와이파이에서 가장 잘 돼요.</p>
  </div>
</div>
<div id="hud">
  <div id="stat"><div class="nm"><b id="hLv">Lv.1</b> <span id="hName"></span></div><div class="bar hp"><i id="hHp"></i><span id="hHpT"></span></div><div class="bar xp"><i id="hXp"></i></div></div>
  <div id="quest"><div id="qT"></div><div id="partner"></div></div>
  <button id="bStory" aria-label="이야기 다시 보기">📜</button>
  <div id="code"></div>
  <div id="btns"><button id="bSkill"><span id="skName">스킬</span><div class="cd" id="skCd"></div></button><button id="bAtk">공격</button></div>
  <div id="toast"></div>
  <div id="deadMsg"></div>
  <div id="bossBar"><div id="bossName"></div><div class="bar"><i id="bossHp"></i></div></div>
</div>
<div id="dlg"><div id="dSp"></div><div id="dTx"></div><div class="nx">▼ 터치해서 계속</div></div>

      ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-26, -22); ctx.lineTo(-15, -9); ctx.fill();
      circ(13, -18, 8);
      ctx.beginPath(); ctx.moveTo(9, -24); ctx.lineTo(11, -32); ctx.lineTo(15, -24); ctx.fill(); ctx.beginPath(); ctx.moveTo(14, -24); ctx.lineTo(18, -31); ctx.lineTo(19, -22); ctx.fill();
      ctx.fillRect(16, -18, 8, 5);
      ctx.fillStyle = m.type === 'shadowwolf' ? '#d58bff' : '#ff4d4d'; circ(15, -19, 1.8);
      break;
    }
    case 'skeleton': case 'knight': {
      const k = r / 15, bob = Math.sin(T * 8 + m.id) * 1.2;
      ctx.scale(f * k, k);
      ctx.fillStyle = fl ? '#fff' : (m.type === 'knight' ? '#5d6470' : t.col);
      ctx.fillRect(-6, -18 + bob, 12, 14); ctx.fillRect(-6, -4, 4, 6); ctx.fillRect(2, -4, 4, 6);
      ctx.fillStyle = fl ? '#fff' : t.col; circ(0, -26 + bob, 9);
      ctx.fillStyle = '#2b2140'; circ(-3, -27 + bob, 2.4); circ(3.5, -27 + bob, 2.4); ctx.fillRect(-3, -21 + bob, 6, 2);
      if (m.type === 'knight') { ctx.fillStyle = '#ff3b3b'; circ(-3, -27 + bob, 1.3); circ(3.5, -27 + bob, 1.3); ctx.fillStyle = '#3b414b'; ctx.beginPath(); ctx.arc(0, -28 + bob, 10, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#c0392b'; ctx.fillRect(-1.5, -44 + bob, 3, 8); }
      ctx.strokeStyle = '#cfd6de'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(8, -12 + bob); ctx.lineTo(18, -26 + bob); ctx.stroke();
      break;
    }
    case 'spirit': case 'morgan': {
      const fy = Math.sin(T * 3 + m.id) * 3;
      if (m.type === 'spirit') {
        ctx.fillStyle = 'rgba(160,110,255,.25)'; circ(0, -16 + fy, 18);
        ctx.fillStyle = fl ? '#fff' : t.col;
        ctx.beginPath(); ctx.arc(0, -18 + fy, 11, Math.PI, 0); ctx.lineTo(11, -6 + fy);
        for (let i = 0; i < 4; i++) ctx.lineTo(11 - (i + .5) * 5.5, -6 + fy + (i % 2 ? -4 : 3) + Math.sin(T * 8 + i) * 2);
        ctx.lineTo(-11, -6 + fy); ctx.fill();
        ctx.fillStyle = '#fff6a8'; circ(-4, -19 + fy, 2.2); circ(4, -19 + fy, 2.2);
      } else {
        ctx.fillStyle = 'rgba(120,40,200,.25)'; circ(0, -22, 34 + Math.sin(T * 4) * 3);
        ctx.fillStyle = fl ? '#fff' : t.col;
        ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-10, -40 + fy); ctx.lineTo(10, -40 + fy); ctx.lineTo(20, 0); ctx.fill();
        ctx.fillStyle = '#2a1340'; circ(0, -44 + fy, 12);
        ctx.fillStyle = fl ? '#fff' : t.col; ctx.beginPath(); ctx.moveTo(-14, -42 + fy); ctx.lineTo(0, -70 + fy); ctx.lineTo(14, -42 + fy); ctx.fill();
        ctx.fillStyle = '#ffe14d'; circ(-4, -44 + fy, 2.4); circ(4, -44 + fy, 2.4);
        for (let i = 0; i < 3; i++) { const a = T * 2 + i * TAU / 3; ctx.fillStyle = '#d58bff'; circ(Math.cos(a) * 30, -26 + Math.sin(a) * 12, 4.5); }
      }
      break;
    }
  }
  ctx.restore();
  if (!t.boss && m.hp < t.hp) { ctx.fillStyle = '#000a'; ctx.fillRect(x - 14, y - r * 2 - 10, 28, 4); ctx.fillStyle = '#ff5c5c'; ctx.fillRect(x - 14, y - r * 2 - 10, 28 * clamp(m.hp / t.hp, 0, 1), 4); }
}
function drawVillage() {
  const pieces = Math.min(4, q.ch - 1), done = q.ch > 4;
  ctx.fillStyle = '#8f8a99'; ctx.fillRect(C - 16, C - 12, 32, 14); ctx.fillStyle = '#a9a4b3'; ctx.fillRect(C - 20, C - 16, 40, 6);
  const glow = done ? 1 : .2 + pieces * .2, py = C - 36 + Math.sin(T * 2) * 3;
  ctx.fillStyle = `rgba(150,220,255,${.15 + glow * .3})`; circ(C, py, 22 + glow * 16 + Math.sin(T * 3) * 2);
  if (done) { ctx.strokeStyle = 'rgba(255,240,170,.5)'; ctx.lineWidth = 2; for (let i = 0; i < 12; i++) { const a = T * .5 + i * TAU / 12; ctx.beginPath(); ctx.moveTo(C + Math.cos(a) * 30, py + Math.sin(a) * 30); ctx.lineTo(C + Math.cos(a) * 60, py + Math.sin(a) * 60); ctx.stroke(); } }
  ctx.fillStyle = done ? '#e9fbff' : `rgba(170,230,255,${.35 + pieces * .15})`;
  ctx.beginPath(); ctx.moveTo(C, py - 18); ctx.lineTo(C + 10, py); ctx.lineTo(C, py + 16); ctx.lineTo(C - 10, py); ctx.closePath(); ctx.fill();
  if (!done) { ctx.strokeStyle = '#2b5d8a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(C - 6, py - 6); ctx.lineTo(C + 2, py + 2); ctx.lineTo(C - 2, py + 9); ctx.moveTo(C + 2, py + 2); ctx.lineTo(C + 8, py - 2); ctx.stroke(); }
  ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('별의 수정 ' + (done ? '★완성★' : pieces + '/4'), C, C + 14);
  const nx = C + 52, ny = C - 4;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ell(nx, ny + 2, 11, 4);
  ctx.fillStyle = '#6a4fa0'; ctx.beginPath(); ctx.moveTo(nx - 11, ny); ctx.lineTo(nx - 6, ny - 22); ctx.lineTo(nx + 6, ny - 22); ctx.lineTo(nx + 11, ny); ctx.fill();
  ctx.fillStyle = '#ffdcb5'; circ(nx, ny - 27, 8);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(nx - 7, ny - 25); ctx.lineTo(nx, ny - 12); ctx.lineTo(nx + 7, ny - 25); ctx.fill();
  ctx.fillStyle = '#2b2140'; circ(nx - 3, ny - 28, 1.4); circ(nx + 3, ny - 28, 1.4);
  ctx.strokeStyle = '#7a4a26'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(nx + 13, ny); ctx.lineTo(nx + 13, ny - 34); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(nx - 22, ny - 48, 44, 12); ctx.fillStyle = '#ffe9a3'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('촌장 루미', nx, ny - 39);
}
function render() {
  const w = innerWidth, h = innerHeight, sc = Math.min(w, h) / 340;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#2b5d8a'; ctx.fillRect(0, 0, w, h);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (w / 2 - cam.x * sc), dpr * (h / 2 - cam.y * sc));
  ctx.drawImage(mapCv, 0, 0);
  drawVillage();
  for (const f of fxs) if (f.k === 'meteor') { ctx.fillStyle = `rgba(255,80,40,${.25 * (1 - f.t)})`; circ(f.x, f.y, 90); }
  const ents = mons.map(m => ({ y: m.y, d: () => drawMon(m) }));
  ents.push({ y: me.y, d: () => drawHero(me, true) });
  if (other) ents.push({ y: other.y, d: () => drawHero(other, false) });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.d();
  for (const b of bullets) { ctx.fillStyle = 'rgba(220,80,255,.35)'; circ(b.x, b.y, 9); ctx.fillStyle = '#f2b3ff'; circ(b.x, b.y, 4.5); }
  for (const s of shots.concat(oshots)) { ctx.fillStyle = 'rgba(255,140,40,.4)'; circ(s.x, s.y, 9); ctx.fillStyle = '#fff1a8'; circ(s.x, s.y, 4.5); }
  for (const f of fxs) {
    if (f.k === 'spin') { ctx.strokeStyle = `rgba(255,255,255,${1 - f.t * 1.6})`; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(f.x, f.y - 12, 30 + f.t * 140, f.t * 12, f.t * 12 + 4.6); ctx.stroke(); }
    else if (f.k === 'meteor') {
      if (f.t < .38) { const k = 1 - f.t / .38; ctx.fillStyle = '#ffd96b'; circ(f.x + k * 120, f.y - k * 220, 10); ctx.strokeStyle = 'rgba(255,220,120,.6)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(f.x + k * 120, f.y - k * 220); ctx.lineTo(f.x + k * 120 + 40, f.y - k * 220 - 70); ctx.stroke(); }
      else { const k = (f.t - .38) / .62; ctx.fillStyle = `rgba(255,170,60,${.8 * (1 - k)})`; circ(f.x, f.y, 20 + k * 80); ctx.fillStyle = `rgba(255,250,200,${1 - k})`; circ(f.x, f.y, 10 + k * 40); }
    }
  }
  for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; circ(p.x, p.y, p.r); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of texts) {
    const k = t.t / t.life;
    ctx.globalAlpha = 1 - k * k; ctx.font = `bold ${t.size}px sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = '#0009'; ctx.strokeText(t.s, t.x, t.y - k * 26); ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y - k * 26);
  }
  ctx.globalAlpha = 1;
  if (qKnown && q.ch <= 4 && !me.dead) {
    let tx, ty;
    const boss = mons.find(m => MT[m.type].boss);
    if (boss) { tx = boss.x; ty = boss.y; }
    else if (sectorAt(me.x, me.y) !== q.ch) { tx = C + Math.cos(SECT[q.ch].ang) * 520; ty = C + Math.sin(SECT[q.ch].ang) * 520; }
    if (tx != null && dist(tx, ty, me.x, me.y) > 180) {
      const a = Math.atan2(ty - me.y, tx - me.x), ax = me.x + Math.cos(a) * 62, ay = me.y - 14 + Math.sin(a) * 62;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.globalAlpha = .6 + Math.sin(T * 5) * .3;
      ctx.fillStyle = boss ? '#ff6bd5' : '#ffd23f'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -9); ctx.lineTo(-2, 0); ctx.lineTo(-6, 9); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  if (other && dist(other.x, other.y, me.x, me.y) > 200) {
    const a = Math.atan2(other.y - me.y, other.x - me.x), ax = me.x + Math.cos(a) * 48, ay = me.y - 14 + Math.sin(a) * 48;
    ctx.font = '12px sans-serif'; ctx.fillText(other.dead ? '🆘' : '💗', ax, ay + 4);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (joy.id !== null) {
    ctx.fillStyle = 'rgba(255,255,255,.15)'; circ(joy.bx, joy.by, 50);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; circ(joy.bx + joy.x * 50, joy.by + joy.y * 50, 22);
  } else if (T < 12) {
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('← 여기를 끌어서 이동', w * .25, h - 40);
  }
}

// ---------- 입력 ----------
cv.addEventListener('pointerdown', e => {
  if (joy.id === null && e.clientX < innerWidth * .6) { joy.id = e.pointerId; joy.bx = e.clientX; joy.by = e.clientY; joy.x = joy.y = 0; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.bx, dy = e.clientY - joy.by; const l = Math.hypot(dx, dy);
  if (l > 50) { joy.bx += dx * (1 - 50 / l) * .5; joy.by += dy * (1 - 50 / l) * .5; dx = e.clientX - joy.bx; dy = e.clientY - joy.by; }
  const l2 = Math.max(50, Math.hypot(dx, dy)); joy.x = dx / l2; joy.y = dy / l2;
});
const joyEnd = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; } };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
const bA = $('#bAtk');
bA.addEventListener('pointerdown', e => { e.preventDefault(); atkHeld = true; try { bA.setPointerCapture(e.pointerId); } catch (_) {} });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => bA.addEventListener(n, () => atkHeld = false));
$('#bSkill').addEventListener('pointerdown', e => { e.preventDefault(); skill(); });
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Enter' && $('#dlg').style.display === 'block') nextLine(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

// ---------- 메뉴 ----------
const inName = $('#inName');
inName.value = save.name || '';
function pickCls(c) { cls = c; document.querySelectorAll('.cls button').forEach(b => b.classList.toggle('on', b.dataset.c === c)); }
pickCls(cls);
document.querySelectorAll('.cls button').forEach(b => b.addEventListener('click', () => pickCls(b.dataset.c)));
function ready() {
  const n = inName.value.trim();
  if (!n) { menuMsg('이름을 먼저 적어 주세요'); inName.focus(); return false; }
  save.name = n; save.cls = cls; writeSave(); menuMsg(''); return true;
}
$('#bHost').addEventListener('click', () => { if (ready()) hostGame(); });
$('#bJoin').addEventListener('click', () => {
  const c = $('#inCode').value.replace(/\D/g, '');
  if (!ready()) return;
  if (c.length !== 4) { menuMsg('방 코드 4자리를 넣어 주세요'); return; }
  joinGame(c);
});
$('#bSolo').addEventListener('click', () => { if (ready()) { Net.mode = 'solo'; Net.isHost = true; startGame(); } });
requestAnimationFrame(frame);
</script>
